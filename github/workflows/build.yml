name: Build Windows exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: 'win64_msvc2022_64'
          modules: ''
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Collect and deploy Qt libraries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build\Release\parkovi_ozera.exe dist\
          windeployqt --release --no-translations dist\parkovi_ozera.exe
          Copy-Item README.md dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: parkovi_ozera_windows
          path: distч
